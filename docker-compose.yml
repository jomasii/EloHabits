services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elohabits}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elohabits}
      POSTGRES_DB: ${POSTGRES_DB:-elohabits}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elohabits}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: dev
    env_file: .env
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run migrate && npm run dev"

volumes:
  dbdata:
